name = "clientgate"
main = "worker.js"
compatibility_date = "2026-10-18"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "LB"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]
